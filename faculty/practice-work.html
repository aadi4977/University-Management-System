<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Card Grid</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .card {
            padding: 20px;
            border-radius: 8px;
            background-color: #e31b1b;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            color: black;
        }
    </style>
</head>

<body>

    <h1>3x3 Card Grid</h1>

    <div class="grid">

        <div class="card">
            <h2>Card 1</h2>
            <button>Click Me</button>
        </div>
        <div class="card">
            <h2>Card 2</h2>
            <button>Click Me</button>
        </div>
        <div class="card">
            <h2>Card 3</h2>
            <button>Click Me</button>
        </div>

        <div class="card">
            <h2>Card 4</h2>
            <button>Click Me</button>
        </div>

        <div class="card">
            <h2>Card 5</h2>
            <button>Click Me</button>
        </div>

        <div class="card">
            <h2>Card 6</h2>
            <button>Click Me</button>
        </div>

        <div class="card">
            <h2>Card 7</h2>
            <button>Click Me</button>
        </div>

        <div class="card">
            <h2>Card 8</h2>
            <button>Click Me</button>
        </div>

        <div class="card">
            <h2>Card 9</h2>
            <button>Click Me</button>
        </div>

    </div>

</body>
</html>
